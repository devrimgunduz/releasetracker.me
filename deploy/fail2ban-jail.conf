# /etc/fail2ban/jail.d/release-radar.conf
# Bans IPs that fail the Release Radar login repeatedly.
# Reads the systemd journal of the web service (where auth logs are emitted).
[release-radar]
enabled  = true
backend  = systemd
filter   = release-radar
journalmatch = _SYSTEMD_UNIT=release-radar-web.service
maxretry = 5
findtime = 10m
bantime  = 1h
# On Rocky/RHEL, firewalld is the ban action:
banaction = firewallcmd-rich-rules
# 'port' is informational for the journal backend; bans are host-wide.
port     = http,https
